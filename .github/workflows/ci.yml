name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # Docker tersedia, dibutuhkan testcontainers (postgis/postgis:16-3.4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal db)"
      - run: go vet ./...
      - run: go test ./...
