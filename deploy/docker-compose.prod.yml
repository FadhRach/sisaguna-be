# Produksi di VPS. Jalankan dari root repo (path relatif di file ini terhadap folder deploy/):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Postgres TIDAK punya `ports`: hanya terjangkau dari network Docker internal.
# Service `backup`: pg_dump harian ke R2 (atau /srv/sisaguna/backups kalau R2 belum diisi). Panduan: deploy/README.md
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MEDIA_HOST_DIR:-/srv/sisaguna/media}/public:/srv/media/public:ro # hanya folder publik
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      PORT: "3030"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      MEDIA_ROOT: /data/media
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      PARTNERS_MODE: ${PARTNERS_MODE:-off}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin SisaGuna}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    volumes:
      - ${MEDIA_HOST_DIR:-/srv/sisaguna/media}:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # API jalan sebagai user non-root (uid 65532); folder media di host dimiliki root. Satu kali jalan: samakan pemiliknya.
  media-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data/media/public /data/media/private && chown -R 65532:65532 /data/media"]
    volumes:
      - ${MEDIA_HOST_DIR:-/srv/sisaguna/media}:/data/media

  backup:
    build: ./backup
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      BACKUP_DEST: ${BACKUP_DEST:-}
      TZ: Asia/Jakarta
    volumes:
      - ${BACKUP_HOST_DIR:-/srv/sisaguna/backups}:/backups # hanya dipakai kalau R2 belum diisi
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.1
    command: ["-path", "/migrations", "-database", "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    volumes:
      - ../db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_HOST_DIR:-/srv/sisaguna/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
